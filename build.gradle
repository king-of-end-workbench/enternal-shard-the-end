plugins {
    id 'eclipse'
    id 'net.neoforged.moddev.legacyforge' version '2.0.121'
}

version = '1.0'
base.archivesName = "modid"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.20.1-47.4.13"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

mixin {
    if (file("src/main/resources/end_elemetn.mixins.json").exists()) {
        add sourceSets.main, "end_elemetn.refmap.json"
        config "end_elemetn.mixins.json"
    }
    // Start of user code block custom mixins
    // Only ONE refmap per source set is possible: the Mixin annotation processor writes a
    // single refmap + .mappings.tsrg pair per compile task, so a second "add" for this same
    // source set silently overwrote the javac args (-AoutRefMapFile / -AoutTsrgFile) and left
    // reobfJar looking for end_elemetn.refmap.json.mappings.tsrg, which was never generated.
    // Both mixin configs share the refmap declared above; only the extra "config" is needed.
    if (file("src/main/resources/end_elemetn_custom.mixins.json").exists()) {
        config "end_elemetn_custom.mixins.json"
    }
    // End of user code block custom mixins
}

dependencies {
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    if (file("src/main/resources/end_elemetn.mixins.json").exists()) {
        manifest.attributes([
                "MixinConfigs": "end_elemetn.mixins.json"
        ])
    }
    // Start of user code block custom mixins
    if (file("src/main/resources/end_elemetn_custom.mixins.json").exists()) {
        manifest.attributes([
                "MixinConfigs": "end_elemetn.mixins.json,end_elemetn_custom.mixins.json"
        ])
    }
    // End of user code block custom mixins
}

apply from: 'mcreator.gradle'
